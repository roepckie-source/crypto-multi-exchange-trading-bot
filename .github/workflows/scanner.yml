name: BTC Multi-Exchange Paper Trader

on:
  workflow_dispatch:

jobs:
  paper-trader:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Auf 15 Minuten verkürzt, da der Bot sich eh nach 3 Min selbst stoppt

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl ccxt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Start Paper Trader
        run: |
          python -u main.py

      - name: Upload Trading Results CSV
        if: always() # Läuft immer, auch wenn vorher etwas schiefgeht
        uses: actions/upload-artifact@v4
        with:
          name: trading-results-data # Name des Download-Ordners auf GitHub
          path: "**/trading_results.csv" # Sucht die Datei überall im Verzeichnis
          if-no-files-found: error # Erzeugt eine fette Fehlermeldung im Log, falls die Datei fehlt
