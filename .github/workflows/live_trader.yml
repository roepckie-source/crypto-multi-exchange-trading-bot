name: Run Live Trader (Real Trading)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-live-trader:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install ccxt

      - name: Live Trader ausführen
        env:
          PYTHONUNBUFFERED: "1"
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          BITRUE_API_KEY: ${{ secrets.BITRUE_API_KEY }}
          BITRUE_API_SECRET: ${{ secrets.BITRUE_API_SECRET }}
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
        run: |
          python live_trader.py

      - name: Ergebnisse als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-trading-results-${{ github.run_id }}
          path: |
            live_trading_results_real.csv
          if-no-files-found: ignore
          retention-days: 7

      - name: Abschlussbericht in GitHub Summary anzeigen
        if: always()
        run: |
          echo "## 📊 Live Trading Abschlussbericht" >> $GITHUB_STEP_SUMMARY
          if [ -s live_trading_results_real.csv ]; then
            echo "### Ausgeführte Trades / Signale:" >> $GITHUB_STEP_SUMMARY
            echo '```csv' >> $GITHUB_STEP_SUMMARY
            cat live_trading_results_real.csv >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Keine Ergebnisse oder Datei leer." >> $GITHUB_STEP_SUMMARY
          fi
