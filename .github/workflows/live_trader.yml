
name: V9 Wallet Intelligence Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wallet-tests:
    name: Wallet Intelligence Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Check Python syntax
        run: |
          python -m py_compile v9_wallet_intelligence.py
          python -m py_compile test_v9_wallet_intelligence.py

      - name: Run wallet tests
        run: python -m pytest -v test_v9_wallet_intelligence.py
