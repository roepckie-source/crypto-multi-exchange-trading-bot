name: Bitrue Paper Trader (DFI)

on:
  workflow_dispatch: # Erlaubt manuelles Ausführen im GitHub Actions Tab
  schedule:
    - cron: '0 */6 * * *' # Bspw. alle 6 Stunden automatisch ausführen (optional)

jobs:
  run-paper-trader:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install ccxt

      - name: Paper Trader ausführen
        run: python paper_trader.py

      - name: Trading-Ergebnisse als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-results-data
          path: **/trading_results.csv
          if-no-files-found: error
