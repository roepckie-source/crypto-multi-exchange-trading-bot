name: Bitrue Paper Trader

on:
  workflow_dispatch:
    inputs:
      total_scans:
        description: 'Anzahl der Scans'
        required: true
        default: '50'
        type: string
      trade_amount:
        description: 'Einsatz in USDT'
        required: true
        default: '10.0'
        type: string
      min_threshold:
        description: 'Mindestgewinn in %'
        required: true
        default: '0.01'
        type: string
      exchange_name:
        description: 'Börse auswählen'
        required: true
        default: 'bitrue'
        type: choice
        options:
          - bitrue
          - kucoin

  schedule:
    - cron: '*/30 * * * *' # Automatischer Lauf alle 30 Minuten

jobs:
  run-paper-trader:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install ccxt

      - name: Paper Trader ausführen
        run: python -u main.py
        env:
          # Nutzt manuell eingegebene Werte (inputs) oder fällt bei Cron-Jobs auf Standardwerte zurück
          EXCHANGE_NAME: ${{ inputs.exchange_name || 'bitrue' }}
          TRADE_AMOUNT: ${{ inputs.trade_amount || '10.0' }}
          MIN_THRESHOLD: ${{ inputs.min_threshold || '0.01' }}
          TOTAL_SCANS: ${{ inputs.total_scans || '50' }}

      - name: Ergebnisse als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-results-${{ github.run_id }}
          path: **/trading_results.csv
          if-no-files-found: ignore
