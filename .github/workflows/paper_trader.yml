
name: Run Paper Trader

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-paper-trader:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install ccxt

      - name: Paper Trader ausführen
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python paper_trader.py

      - name: Ergebnisse als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-trading-results-${{ github.run_id }}
          path: |
            paper_trading_results.csv
          if-no-files-found: ignore
          retention-days: 7

      - name: Abschlussbericht in GitHub Summary anzeigen
        if: always()
        run: |
          echo "## 📊 Paper Trading Abschlussbericht" >> $GITHUB_STEP_SUMMARY
          if [ -s paper_trading_results.csv ]; then
            echo "### Simulierte Trades / Signale:" >> $GITHUB_STEP_SUMMARY
            echo '```csv' >> $GITHUB_STEP_SUMMARY
            cat paper_trading_results.csv >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Keine Simulations-Ergebnisse oder Datei leer." >> $GITHUB_STEP_SUMMARY
          fi
