name: Bitrue Paper Trader (Intervall-Scan)

on:
  workflow_dispatch: # Erlaubt manuelles Starten
  schedule:
    # Läuft automatisch alle 30 Minuten (in UTC-Zeit)
    - cron: '*/30 * * * *'

jobs:
  run-paper-trader:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install ccxt

      - name: Paper Trader ausführen
        run: python -u main.py
        env:
          EXCHANGE_NAME: "bitrue"
          TRADE_AMOUNT: "10.0"     # 10 EUR/USDT Einsatz
          MIN_THRESHOLD: "0.01"    # Mindestgewinn 0.01%
          TOTAL_SCANS: "30"        # 30 Scans pro Intervall (~2-3 Minuten Laufzeit)

      - name: Ergebnisse als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Eindeutiger Name pro Durchlauf (verhindert Überschreiben)
          name: trading-results-${{ github.run_id }}
          path: **/trading_results.csv
          if-no-files-found: ignore
