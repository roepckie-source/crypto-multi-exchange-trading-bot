name: Run Live Trader (Dry Run)

on:
  workflow_dispatch:

jobs:
  run-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt

      - name: Run Live Trader Dry Run
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPRASE: ${{ secrets.OKX_PASSPRASE }}
          KUCOIN_API_KEY: ${{ secrets.KUCOIN_API_KEY }}
          KUCOIN_API_SECRET: ${{ secrets.KUCOIN_API_SECRET }}
          KUCOIN_PASSPRASE: ${{ secrets.KUCOIN_PASSPRASE }}
        run: |
          python live_trader.py

      - name: Upload Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-results
          path: |
            paper_trading_results.csv
            live_trading_results.csv
