name: Run Live Trader (Dry Run)

on:
  workflow_dispatch:

jobs:
  run-dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt

      - name: Run Live Trader Dry Run
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPRASE: ${{ secrets.OKX_PASSPRASE }}
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
          BITGET_PASSPRASE: ${{ secrets.BITGET_PASSPRASE }}
        run: |
          python live_trader.py

      - name: Upload Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-results
          path: live_dry_run_results.csv
